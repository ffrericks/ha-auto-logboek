                  `<label>Pomp${al.inp('pomp', r.pomp, 'Shell', 'text')}</label>` +
                  `<label>Plaats${al.inp('plaats', r.plaats, 'Utrecht', 'text')}</label>` +
                  `<label>Notitie${al.inp('notitie', r.notitie, '', 'text')}</label>` +
                  `<div class="al-b"><button class="pri" data-al="tank-save" data-id="${r.id}">Opslaan</button>` +
                  `<button data-al="close" data-id="${r.id}">Sluiten</button><button data-al="tank-del" data-id="${r.id}">Verwijderen</button></div></div>`;
              } else {
                h += `<div class="al-b"><button class="link" data-al="edit" data-id="${r.id}">Wijzigen</button></div>`;
              }
              h += '</div>';
            }
            if (list.length > 8) h += `<button class="link" data-al="all-tank">${al.allTank ? 'Minder tonen' : `Alle ${list.length} tonen`}</button>`;
            return h;
          };

          al.tripsFor = (a, month) => {
            if ((a.geladen_maanden || []).includes(month)) return a.ritten.filter((t) => t.start.startsWith(month));
            const key = month + '|' + a.versie;
