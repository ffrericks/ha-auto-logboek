            if (!al.busy[key]) {
              al.busy[key] = true;
              al.hass().connection.sendMessagePromise({ type: 'call_service', domain: 'auto_logboek', service: 'lijst',
                service_data: { auto: a.entry_id, maand: month }, return_response: true })
                .then((r) => { al.cache[key] = (r.response || {}).ritten || []; al.refresh(true); });
            }
            return null;
          };

          al.renderTrips = (a) => {
            const month = al.month || al.monthKey(new Date());
            const trips = al.tripsFor(a, month);
            const b = (a.maanden || {})[month] || {};
            const isNow = month === al.monthKey(new Date());
            let h = `<div class="al-nav"><button data-al="month" data-n="-1">‹</button><b>${esc(al.monthName(month))}</b>` +
              `<button data-al="month" data-n="1" ${isNow ? 'disabled' : ''}>›</button></div>`;
            h += `<div class="al-s al-sum">${nl(b.km)} km · werk ${nl(b.km_werk)} km (${al.eur(b.kosten_werk)}) · privé ${nl(b.km_prive)} km (${al.eur(b.kosten_prive)})${b.voorlopig ? ' *' : ''}</div>`;
            if (trips === null) return h + '<div class="al-empty">Laden...</div>';
            if (!trips.length) return h + '<div class="al-empty">Geen ritten in deze maand.</div>';
            for (const t of trips) {
              const werk = t.soort_def === 'werk';
              h += `<div class="al-r"><div class="al-top"><b>${al.day(t.start)} ${al.time(t.start)}${t.eind ? '-' + esc(t.eind) : ''}</b>` +
                `<span class="al-right">${nl(t.km, t.km % 1 ? 1 : 0)} km · ${al.eur(t.kosten)}${t.voorlopig ? '*' : ''}</span></div>` +
                `<div class="al-trip"><span>${esc(t.van)} → ${esc(t.naar)}</span>` +
                `<button class="al-chip ${werk ? 'werk' : 'prive'}" data-al="trip-soort" data-id="${t.id}" data-soort="${werk ? 'prive' : 'werk'}">${werk ? 'Werk' : 'Privé'}</button></div>` +
                `<div class="al-s small">${t.handmatig ? 'zelf aangepast (automatisch: ' + (t.soort_auto === 'werk' ? 'werk' : 'privé') + ', ' + esc(t.reden) + ')' : esc(t.reden)}` +
                `${t.km_start ? ` · km ${nl(t.km_start)} → ${nl(t.km_eind)}` : ''}${t.notitie ? ' · ' + esc(t.notitie) : ''}</div>`;
              if (al.open[t.id]) {
                h += `<div class="al-in al-edit" data-id="${t.id}"><label>Notitie${al.inp('notitie', t.notitie, 'bijv. klant of reden', 'text')}</label>` +
                  `<div class="al-b"><button class="pri" data-al="trip-save" data-id="${t.id}">Opslaan</button>` +
                  (t.handmatig ? `<button data-al="trip-soort" data-id="${t.id}" data-soort="auto">Automatisch indelen</button>` : '') +
                  `<button data-al="close" data-id="${t.id}">Sluiten</button><button data-al="trip-del" data-id="${t.id}">Verwijderen</button></div></div>`;
              } else {
                h += `<div class="al-b"><button class="link" data-al="edit" data-id="${t.id}">Wijzigen</button></div>`;
              }
              h += '</div>';
            }
            return h;
          };

          al.renderForm = () => {
            const today = new Date();
            const d = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
            return `<details class="al-form" data-form="tank"><summary>Tankbeurt zelf toevoegen</summary>
              <div class="al-grid"><label>Datum<input name="datum" type="date" value="${d}"></label><label>Tijd<input name="tijd" type="time" value="12:00"></label>
              <label>Pomp${al.inp('pomp', '', 'Argos', 'text')}</label><label>Plaats${al.inp('plaats', '', 'Utrecht', 'text')}</label>
              <label>Bedrag${al.inp('bedrag', '', '51,23')}</label><label>Literprijs${al.inp('literprijs', '', '2,079')}</label>
              <label>Liters (mag leeg)${al.inp('liters', '', '24,6')}</label><label>Km-stand${al.inp('km', '', '120000', 'numeric')}</label></div>
              <div class="al-b"><button class="pri" data-al="form-tank">Toevoegen</button></div><div class="al-status"></div></details>
              <details class="al-form" data-form="rit"><summary>Rit zelf toevoegen</summary>
              <div class="al-grid"><label>Datum<input name="datum" type="date" value="${d}"></label><label>Vertrek<input name="tijd" type="time" value="09:00"></label>
              <label>Van${al.inp('van', '', 'Thuis', 'text')}</label><label>Naar${al.inp('naar', '', 'Kantoor', 'text')}</label>
              <label>Afstand (km)${al.inp('km', '', '12')}</label><label>Aankomst<input name="eind_tijd" type="time"></label>
              <label>Soort<select name="soort"><option value="werk">Werk</option><option value="prive">Privé</option></select></label>
              <label>Notitie${al.inp('notitie', '', '', 'text')}</label></div>
              <div class="al-b"><button class="pri" data-al="form-rit">Toevoegen</button></div><div class="al-status"></div></details>`;
          };

          // ---- charts --------------------------------------------------------------
          al.g = al.g || { period: 'maand', anchor: null, metric: 'km', pie: 'soort', per: 'dag', type: 'lijn' };
          const PAL = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6'];
          const TOTAL_C = '#7a7974';
          al.allTrips = (a) => {
            const key = 'all|' + a.versie;
            if (al.cache[key]) return al.cache[key];
            if (!al.busy[key]) {
              al.busy[key] = true;
              al.hass().connection.sendMessagePromise({ type: 'call_service', domain: 'auto_logboek', service: 'lijst',
                service_data: { auto: a.entry_id }, return_response: true })
                .then((r) => { al.cache[key] = (r.response || {}).ritten || []; al.refresh(true); });
            }
            return null;
          };
          al.iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
          al.monday = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
          al.weekNo = (d) => {
            const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
            return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
          };
          al.anchor = () => (al.g.anchor ? new Date(al.g.anchor + 'T12:00') : new Date());
          al.range = () => {
            const a = al.anchor();
            const dm = (d) => `${d.getDate()}/${d.getMonth() + 1}`;
            if (al.g.period === 'week') {
              const from = al.monday(a); const to = new Date(from); to.setDate(to.getDate() + 7);
              const last = new Date(to); last.setDate(last.getDate() - 1);
              return { from, to, label: `Week ${al.weekNo(from)} (${dm(from)} - ${dm(last)})` };
            }
            if (al.g.period === 'maand') {
              const from = new Date(a.getFullYear(), a.getMonth(), 1);
              return { from, to: new Date(a.getFullYear(), a.getMonth() + 1, 1), label: from.toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' }) };
            }
            return { from: new Date(a.getFullYear(), 0, 1), to: new Date(a.getFullYear() + 1, 0, 1), label: String(a.getFullYear()) };
          };
          al.shiftPeriod = (n) => {
            const a = al.anchor();
            if (al.g.period === 'week') a.setDate(a.getDate() + 7 * n);
            else if (al.g.period === 'maand') a.setMonth(a.getMonth() + n, 1);
            else a.setFullYear(a.getFullYear() + n);
            al.g.anchor = al.iso(a);
          };
          al.val = (t) => (al.g.metric === 'km' ? t.km : al.g.metric === 'kosten' ? (t.kosten || 0) : 1);
          al.fmtVal = (v) => (al.g.metric === 'km' ? nl(v, v > 0 && v < 10 && v % 1 ? 1 : 0) + ' km' : al.g.metric === 'kosten' ? al.eur(v) : nl(v) + (v === 1 ? ' rit' : ' ritten'));
          al.PERS = { week: ['dag'], maand: ['dag', 'week'], jaar: ['dag', 'week', 'maand'] };
          al.groups = () => {
            if (al.g.pie === 'dag') return ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'].map((n, i) => [n, (t, d) => (d.getDay() + 6) % 7 === i]);
            if (al.g.pie === 'dagdeel') return [['Ochtend (06-12)', 6, 12], ['Middag (12-18)', 12, 18], ['Avond (18-24)', 18, 24], ['Nacht (00-06)', 0, 6]].map(([n, a, b]) => [n, (t, d) => d.getHours() >= a && d.getHours() < b]);
            return [['Werk', (t) => t.soort_def === 'werk'], ['Privé', (t) => t.soort_def !== 'werk']];
          };
          al.donut = (parts, total) => {
            const R = 84; const r = 52; const c = 90;
            const P = (rad, ang) => `${(c + rad * Math.cos(ang)).toFixed(2)},${(c + rad * Math.sin(ang)).toFixed(2)}`;
            const nz = parts.filter((p) => p.v > 0);
            let s = ''; let ang = -Math.PI / 2;
            if (!nz.length) s = `<circle cx="${c}" cy="${c}" r="${(R + r) / 2}" fill="none" stroke="var(--divider-color)" stroke-width="${R - r}"/>`;
            else if (nz.length === 1) s = `<circle cx="${c}" cy="${c}" r="${(R + r) / 2}" fill="none" stroke="${nz[0].c}" stroke-width="${R - r}" data-tip="${esc(nz[0].tip)}"/>`;
            else {
              for (const p of nz) {
                const a2 = ang + (p.v / total) * 2 * Math.PI; const big = a2 - ang > Math.PI ? 1 : 0;
                s += `<path d="M${P(R, ang)} A${R},${R} 0 ${big} 1 ${P(R, a2)} L${P(r, a2)} A${r},${r} 0 ${big} 0 ${P(r, ang)} Z" fill="${p.c}" stroke="var(--card-background-color,#fff)" stroke-width="2" data-tip="${esc(p.tip)}"/>`;
                ang = a2;
              }
            }
            return `<svg viewBox="0 0 180 180" class="al-donut">${s}<text x="90" y="88" text-anchor="middle" class="al-dt">${esc(al.fmtVal(total))}</text>` +
              `<text x="90" y="106" text-anchor="middle" class="al-ds">totaal</text></svg>`;
          };
          al.nice = (v) => { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; };
          al.buckets = (rg) => {
            const per = al.g.per; const out = [];
            if (per === 'maand') {
              for (let m = 0; m < 12; m++) { const d = new Date(rg.from.getFullYear(), m, 1); out.push({ key: al.iso(d).slice(0, 7), short: d.toLocaleDateString('nl-NL', { month: 'short' }).replace('.', ''), long: d.toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' }) }); }
            } else if (per === 'week') {
              for (let d = al.monday(rg.from); d < rg.to; d.setDate(d.getDate() + 7)) {
                const e = new Date(d); e.setDate(e.getDate() + 6);
                out.push({ key: al.iso(d), short: 'wk ' + al.weekNo(d), long: `week ${al.weekNo(d)} (${d.getDate()}/${d.getMonth() + 1} - ${e.getDate()}/${e.getMonth() + 1})` });
              }
            } else {
              for (let d = new Date(rg.from); d < rg.to; d.setDate(d.getDate() + 1)) {
                const wd = d.toLocaleDateString('nl-NL', { weekday: 'short' }).slice(0, 2);
                out.push({ key: al.iso(d), short: al.g.period === 'week' ? `${wd} ${d.getDate()}` : String(d.getDate()), long: `${wd} ${d.getDate()}/${d.getMonth() + 1}` });
              }
            }
            return out;
          };
          al.bucketKey = (d) => (al.g.per === 'maand' ? al.iso(d).slice(0, 7) : al.g.per === 'week' ? al.iso(al.monday(d)) : al.iso(d));
          al.lineChart = (bs) => {
            const W = 640; const H = 230; const L = 46; const Rm = 10; const T = 12; const B = 28;
            const iw = W - L - Rm; const ih = H - T - B; const n = bs.length;
            const max = al.nice(Math.max(...bs.map((b) => b.tot), 0));
            const x = (i) => L + (n === 1 ? iw / 2 : (i + 0.5) * (iw / n));
            const y = (v) => T + ih - (v / max) * ih;
            let s = '';
            for (let k = 0; k <= 4; k++) {
              const v = (max / 4) * k;
              s += `<line x1="${L}" x2="${W - Rm}" y1="${y(v)}" y2="${y(v)}" class="al-grid${k ? '' : ' base'}"/>` +
                `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="al-ax">${esc(al.g.metric === 'kosten' ? '€ ' + nl(v) : nl(v))}</text>`;
            }
            const every = Math.ceil(n / 12);
            bs.forEach((b, i) => { if (i % every === 0) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" class="al-ax">${esc(b.short)}</text>`; });
            if (al.g.type === 'staaf') {
              const bw = Math.max(1, Math.min(28, iw / n - 2));
              bs.forEach((b, i) => {
                let base = 0;
                for (const [v, c] of [[b.werk, PAL[0]], [b.prive, PAL[1]]]) {
                  if (!v) continue;
                  const h = Math.max(1, (v / max) * ih - (base ? 2 : 0));
                  s += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(y(base + v) + (base ? 0 : 0)).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3, bw / 3)}" fill="${c}"/>`;
                  base += v;
                }
              });
            } else {
              const line = (key, c, w, dash) => {
                const pts = bs.map((b, i) => `${x(i).toFixed(1)},${y(b[key]).toFixed(1)}`).join(' ');
                let o = `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"${dash ? ' stroke-dasharray="5 4"' : ''}/>`;
                if (n <= 31) bs.forEach((b, i) => { if (b[key]) o += `<circle cx="${x(i)}" cy="${y(b[key])}" r="4" fill="${c}" stroke="var(--card-background-color,#fff)" stroke-width="2"/>`; });
                return o;
              };
              s += line('tot', TOTAL_C, 2, true) + line('prive', PAL[1], 2) + line('werk', PAL[0], 2);
            }
            s += `<line class="al-cross" x1="0" x2="0" y1="${T}" y2="${T + ih}" style="display:none"/>`;
            bs.forEach((b, i) => {
              const tip = `${b.long}: ${al.fmtVal(b.tot)}` + (b.tot ? ` (werk ${al.fmtVal(b.werk)}, privé ${al.fmtVal(b.prive)})` : '');
              s += `<rect x="${(x(i) - iw / n / 2).toFixed(1)}" y="${T}" width="${(iw / n).toFixed(1)}" height="${ih}" fill="transparent" data-tip="${esc(tip)}" data-cx="${x(i).toFixed(1)}"/>`;
            });
            return `<svg viewBox="0 0 ${W} ${H}" class="al-line">${s}</svg>`;
          };
          al.renderGraph = (a) => {
            const all = al.allTrips(a);
            const g = al.g;
            if (!al.PERS[g.period].includes(g.per)) g.per = g.period === 'jaar' ? 'week' : 'dag';
            const btn = (k, v, label) => `<button class="al-seg ${g[k] === v ? 'on' : ''}" data-al="g" data-k="${k}" data-v="${v}">${label}</button>`;
            const rg = al.range();
            const isNow = rg.to > new Date();
            let h = `<div class="al-ctrl"><div class="al-segs">${btn('period', 'week', 'Week')}${btn('period', 'maand', 'Maand')}${btn('period', 'jaar', 'Jaar')}</div>` +
              `<div class="al-nav2"><button data-al="gshift" data-n="-1">‹</button><b>${esc(rg.label)}</b><button data-al="gshift" data-n="1" ${isNow ? 'disabled' : ''}>›</button></div>` +
              `<div class="al-segs">${btn('metric', 'km', 'Km')}${btn('metric', 'kosten', 'Kosten')}${btn('metric', 'ritten', 'Ritten')}</div></div>`;
            if (all === null) return h + '<div class="al-empty">Laden...</div>';
            const trips = all.filter((t) => { const d = new Date(t.start); return d >= rg.from && d < rg.to; });
            const total = trips.reduce((s, t) => s + al.val(t), 0);
            // pie
            const parts = al.groups().map(([name, f], i) => {
              const v = trips.filter((t) => f(t, new Date(t.start))).reduce((s, t) => s + al.val(t), 0);
              const pct = total ? Math.round((v / total) * 100) : 0;
              return { name, v, c: PAL[i], pct, tip: `${name}: ${al.fmtVal(v)} (${pct}%)` };
            });
            h += `<div class="al-charts"><div class="al-pie"><div class="al-sub">Verdeling ${btn('pie', 'soort', 'Werk/privé')}${btn('pie', 'dag', 'Weekdag')}${btn('pie', 'dagdeel', 'Dagdeel')}</div>` +
              `<div class="al-pie-body">${al.donut(parts, total)}<div class="al-leg">${parts.map((p) =>
                `<div><i style="background:${p.c}"></i><span>${esc(p.name)}</span><b>${esc(al.fmtVal(p.v))}</b><small>${p.pct}%</small></div>`).join('')}</div></div></div>`;
            // line / bars
            const bs = al.buckets(rg).map((b) => ({ ...b, tot: 0, werk: 0, prive: 0 }));
            const idx = Object.fromEntries(bs.map((b, i) => [b.key, i]));
            for (const t of trips) {
              const i = idx[al.bucketKey(new Date(t.start))];
              if (i === undefined) continue;
              const v = al.val(t); bs[i].tot += v; bs[i][t.soort_def === 'werk' ? 'werk' : 'prive'] += v;
            }
            const perBtns = al.PERS[g.period].map((p) => btn('per', p, { dag: 'Per dag', week: 'Per week', maand: 'Per maand' }[p])).join('');
            const sum = (k) => bs.reduce((s, b) => s + b[k], 0);
            h += `<div class="al-lc"><div class="al-sub">${perBtns}<span class="al-sp"></span>${btn('type', 'lijn', 'Lijn')}${btn('type', 'staaf', 'Staaf')}</div>` +
              `<div class="al-legline"><span><i style="background:${PAL[0]}"></i>Werk ${esc(al.fmtVal(sum('werk')))}</span><span><i style="background:${PAL[1]}"></i>Privé ${esc(al.fmtVal(sum('prive')))}</span>` +
              (g.type === 'lijn' ? `<span><i class="dash"></i>Totaal ${esc(al.fmtVal(sum('tot')))}</span>` : '') + '</div>' +
              `<div class="al-graph">${al.lineChart(bs)}<div class="al-tip"></div></div>` +
              `<details class="al-table"><summary>Als tabel</summary><table class="al-t"><tr><th></th><th>Totaal</th><th>Werk</th><th>Privé</th></tr>${
                bs.filter((b) => b.tot).map((b) => `<tr><td class="n">${esc(b.long)}</td><td>${esc(al.fmtVal(b.tot))}</td><td>${esc(al.fmtVal(b.werk))}</td><td>${esc(al.fmtVal(b.prive))}</td></tr>`).join('') ||
                '<tr><td class="n" colspan="4">Geen ritten in deze periode</td></tr>'}</table></details></div></div>`;
            return h;
          };
          if (!window.__al1T) {
            // tooltip + crosshair for elements with data-tip (mouse hover, touch tap)
            window.__al1T = true;
            const show = (ev) => {
              const path = ev.composedPath();
              const el = path.find((e) => e && e.getAttribute && e.getAttribute('data-tip'));
              const graph = path.find((e) => e && e.classList && (e.classList.contains('al-graph') || e.classList.contains('al-pie-body')));
              const root = path.find((e) => e && e.classList && e.classList.contains('al'));
              if (!root) return;
              for (const tp of root.querySelectorAll('.al-tip, .al-ptip')) if (!el || !graph || !graph.contains(tp)) tp.style.display = 'none';
              for (const cr of root.querySelectorAll('.al-cross')) if (!el || !el.dataset.cx) cr.style.display = 'none';
              if (!el || !graph) return;
              let tip = graph.querySelector('.al-tip, .al-ptip');
              if (!tip) { tip = document.createElement('div'); tip.className = 'al-ptip'; graph.appendChild(tip); }
              tip.textContent = el.getAttribute('data-tip');
              tip.style.display = 'block';
              const gr = graph.getBoundingClientRect();
              const px = Math.min(Math.max(ev.clientX - gr.left + 12, 0), gr.width - tip.offsetWidth);
              tip.style.left = px + 'px'; tip.style.top = Math.max(0, ev.clientY - gr.top - tip.offsetHeight - 10) + 'px';
              const cr = graph.querySelector('.al-cross');
              if (cr && el.dataset.cx) { cr.setAttribute('x1', el.dataset.cx); cr.setAttribute('x2', el.dataset.cx); cr.style.display = ''; }
            };
            document.addEventListener('pointermove', show, true);
            document.addEventListener('pointerdown', show, true);
          }

          al.refresh = (force) => {
            const a = al.attr();
            for (const c of [...al.cards]) {
              if (!c.isConnected) { al.cards.delete(c); continue; }
              const root = c.shadowRoot;
              if (!root) continue;
              for (const box of root.querySelectorAll('[data-box]')) {
                const kind = box.dataset.box;
                if (!a) { box.innerHTML = '<div class="al-empty">De integratie Auto logboek is (nog) niet geladen.</div>'; continue; }
                const key = kind === 'form' ? 'form' : [a.versie, al.month, JSON.stringify(al.open), al.allTank, ['ritten', 'grafiek'].includes(kind) ? Object.keys(al.cache).length : '', kind === 'grafiek' ? JSON.stringify(al.g) : ''].join('|');
                if (box.dataset.k === key && !(force && ['ritten', 'grafiek'].includes(kind))) continue;
                box.dataset.k = key;
                box.innerHTML = kind === 'overzicht' ? al.renderOverview(a) : kind === 'tank' ? al.renderTank(a) : kind === 'ritten' ? al.renderTrips(a) : kind === 'grafiek' ? al.renderGraph(a) : al.renderForm();
              }
            }
          };

          al.vals = (el) => {
            const out = {};
            for (const i of el.querySelectorAll('input[name], select[name]')) out[i.name] = i.value.trim();
            return out;
          };
          al.fail = (r) => { if (!r.ok) alert(r.fout || 'Dat lukte niet'); return r.ok; };
          al.arm = (el, label) => {
            if (Date.now() - Number(el.dataset.armed || 0) < 4000) return true;
            el.dataset.armed = Date.now(); el.textContent = 'Zeker?'; el.classList.add('arm');
            setTimeout(() => { if (el.isConnected) { el.dataset.armed = ''; el.textContent = label; el.classList.remove('arm'); } }, 4000);
            return false;
          };
          al.act = async (el) => {
            const a = el.dataset.al;
            const id = el.dataset.id;
