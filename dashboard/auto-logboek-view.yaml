der-radius:8px;\n    background:var(--card-background-color);color:var(--primary-text-color);box-sizing:border-box;min-width:0}\n  .al-in>input{flex:1 1 120px}\n  .al-edit{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}\n  .al-edit label,.al-form label{display:flex;flex-direction:column;font-size:12px;color:var(--secondary-text-color);gap:2px}\n  .al-edit .al-b{grid-column:1/-1}\n  .al-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}\n  .al-trip{display:flex;align-items:center;gap:8px}\n  .al-trip span{flex:1}\n  .al button.al-chip{border-radius:16px;padding:3px 12px;font-weight:500}\n  .al button.al-chip.werk{background:#e3f0fd;border-color:#64a8f0;color:#0d47a1}\n  .al button.al-chip.prive{background:#f1f1f1;border-color:#c8c8c8;color:#555}\n  .al-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}\n  .al-nav b{text-transform:capitalize}\n  .al-nav button{padding:2px 12px;font-size:16px}\n  .al-empty{color:var(--secondary-text-color);padding:6px 0}\n  .al-form{border-top:1px solid var(--divider-color);padding:8px 0}\n  .al-form:first-child{border-top:none}\n  .al-form summary{cursor:pointer;font-weight:500}\n  .al-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:8px 0}\n  .al-status{font-size:13px;min-height:1em;margin-top:4px}\n  .al-status.ok{color:var(--success-color,#2e7d32)}\n  .al-status.err{color:var(--error-color,#c62828)}\n  .al-ctrl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}\n  .al-segs{display:inline-flex;border:1px solid var(--divider-color);border-radius:9px;overflow:hidden}\n  .al .al-segs button{border:none;border-radius:0;padding:5px 12px}\n  .al .al-segs button+button{border-left:1px solid var(--divider-color)}\n  .al button.al-seg.on{background:var(--primary-color);color:#fff}\n  .al-sub .al-seg{margin:0 2px 4px 0}\n  .al-sub .al-seg:not(.on){color:var(--secondary-text-color)}\n  .al-nav2{display:flex;align-items:center;gap:8px}\n  .al-nav2 b{text-transform:capitalize;min-width:120px;text-align:center}\n  .al-nav2 button{padding:2px 12px;font-size:16px}\n  .al-charts{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:14px 24px}\n  .al-gwrap{container-type:inline-size}\n  @container (max-width:660px){.al-charts{grid-template-columns:1fr}}\n  .al-sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:13px;color:var(--secondary-text-color);margin-bottom:6px}\n  .al-sub>.al-seg:first-of-type{margin-left:6px}\n  .al-lc .al-sub>.al-seg:first-of-type{margin-left:0}\n  .al-sp{flex:1}\n  .al-pie-body{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}\n  .al-donut{width:170px;height:170px;flex:none}\n  .al-dt{font-size:17px;font-weight:600;fill:var(--primary-text-color)}\n  .al-ds{font-size:11px;fill:var(--secondary-text-color)}\n  .al-leg{flex:1;min-width:150px;font-size:13px}\n  .al-leg div{display:grid;grid-template-columns:12px 1fr auto 38px;gap:6px;align-items:center;padding:2px 0}\n  .al-leg i,.al-legline i{display:inline-block;width:10px;height:10px;border-radius:3px}\n  .al-leg b{font-weight:500;text-align:right}\n  .al-leg small{color:var(--secondary-text-color);text-align:right}\n  .al-legline{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--primary-text-color);margin-bottom:2px}\n  .al-legline i{margin-right:5px}\n  .al-legline i.dash{width:14px;height:0;border-top:2px dashed #7a7974;border-radius:0;vertical-align:3px}\n  .al-graph{position:relative}\n  .al-line{width:100%;height:auto;display:block}\n  .al-grid{stroke:var(--divider-color);stroke-width:1}\n  .al-grid.base{stroke:var(--secondary-text-color);opacity:.5}\n  .al-ax{font-size:11px;fill:var(--secondary-text-color)}\n  .al-cross{stroke:var(--secondary-text-color);stroke-width:1;stroke-dasharray:3 3}\n  .al-tip,.al-ptip{position:absolute;display:none;pointer-events:none;background:var(--primary-text-color);color:var(--card-background-color,#fff);\n    font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:2}\n  .al-table{margin-top:8px}\n  .al-table summary{cursor:pointer;color:var(--secondary-text-color);font-size:13px}\n</style>" + '<div class="al-gwrap"><div class="al" data-box="form"></div></div>';
          ]]]
      styles:
        card:
        - padding: 10px 16px 12px
        - pointer-events: auto
        - cursor: default
        grid:
        - grid-template-areas: '"inhoud"'
        - grid-template-columns: 1fr
        custom_fields:
          inhoud:
          - width: 100%
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: heading
      heading: Ritten
      icon: mdi:map-marker-path
    - type: custom:button-card
      entity: sensor.my_car_logboek
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: none
      hold_action:
        action: none
      custom_fields:
        inhoud: |-
          [[[

          const SENSOR = "sensor.my_car_logboek";
          const al = window.__al1 = window.__al1 || { cards: new Set(), open: {}, cache: {}, month: null, allTank: false, busy: {} };
          al.cards.add(this);
          const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          const nl = (n, d = 0) => Number(n || 0).toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d });
          const pad = (x) => String(x).padStart(2, '0');
          al.esc = esc; al.nl = nl;
          al.hass = () => document.querySelector('home-assistant').hass;
          al.attr = () => { const s = al.hass().states[SENSOR]; return s ? s.attributes : null; };
          al.call = (service, data) => al.hass().connection.sendMessagePromise({
            type: 'call_service', domain: 'auto_logboek', service, service_data: { auto: (al.attr() || {}).entry_id, ...data }, return_response: true,
          }).then((r) => r.response || { ok: true }, (e) => ({ ok: false, fout: e.message || String(e) }));
          al.monthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
          al.monthName = (k) => new Date(k + '-15').toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' });
          al.shift = (k, n) => { const d = new Date(k + '-15'); d.setMonth(d.getMonth() + n); return al.monthKey(d); };
          al.day = (iso) => { const d = new Date(iso); return `${d.toLocaleDateString('nl-NL', { weekday: 'short' }).slice(0, 2)} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
          al.time = (iso) => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
          al.eur = (n, d = 2) => '€ ' + nl(n, d);
          al.inp = (name, value, ph, mode = 'decimal', w = '') => `<input name="${name}" value="${esc(value ?? '')}" placeholder="${esc(ph)}" inputmode="${mode}" autocomplete="off" style="${w}">`;
          al.numText = (n, d) => (n === null || n === undefined || n === '') ? '' : String(+Number(n).toFixed(d)).replace('.', ',');

          al.renderOverview = (a) => {
            const now = new Date();
            const cur = al.monthKey(now);
            const periods = [[al.monthName(cur), cur], [al.monthName(al.shift(cur, -1)), al.shift(cur, -1)],
              ['Heel ' + now.getFullYear(), String(now.getFullYear())], ['Heel ' + (now.getFullYear() - 1), String(now.getFullYear() - 1)]];
            const m = a.maanden || {};
            const star = (b) => b.voorlopig ? '<sup title="Nog niet alle bedragen ingevuld">*</sup>' : '';
            let h = '<table class="al-t"><tr><th></th><th>Totaal</th><th>Werk</th><th>Privé</th></tr>';
            for (const [label, k] of periods) {
              const b = m[k] || {};
              h += `<tr><td class="n">${esc(label)}<br><span>${b.ritten || 0} rit${b.ritten === 1 ? '' : 'ten'}</span></td>` +
                `<td>${nl(b.km)} km<br><span>${al.eur(b.kosten)}${star(b)}</span></td>` +
                `<td>${nl(b.km_werk)} km<br><span>${al.eur(b.kosten_werk)}${star(b)}</span></td>` +
                `<td>${nl(b.km_prive)} km<br><span>${al.eur(b.kosten_prive)}${star(b)}</span></td></tr>`;
            }
            h += '</table><div class="al-h">Tankbeurten</div><table class="al-t"><tr><th></th><th>Aantal</th><th>Liters</th><th>Betaald</th></tr>';
            for (const [label, k] of periods) {
              const b = m[k] || {};
              h += `<tr><td class="n">${esc(label)}</td><td>${b.tank_aantal || 0}</td><td>${nl(b.tank_liters, 1)} L</td>` +
                `<td>${al.eur(b.tank_bedrag)}${b.tank_open ? `<br><span class="warn">${b.tank_open} zonder bedrag</span>` : ''}</td></tr>`;
            }
            h += '</table>';
            const prijs = a.tankprijs == null ? 'nog onbekend' : `${al.eur(a.tankprijs, 3)} per liter${a.voorlopig ? ' (voorlopig)' : ''}`;
            h += `<div class="al-v">In de tank: ${prijs}. Verbruik ${nl(a.verbruik, 1)} L/100 km${a.verbruik_geleerd ? ' (gemeten)' : ' (standaard tot er genoeg gereden is)'}.` +
              `${Object.values(m).some((b) => b.voorlopig) ? ' * = voorlopig, er ontbreekt nog een bedrag.' : ''}</div>`;
